    <header>
        <nav class="navbar navbar-expand-lg navbar-light ">
            <a class="navbar-brand" href="/index.html">
                <h2 id="logo">Psico<span class="purple">Mind</span></h2>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="../psicologos/psicologos.html">Psicologos</a>

                                account_circle

                    </li>

                        <a class="nav-link" href="../login/login.html" id="join">Entre</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main>

        <div class="cardx">
            <div class="cardx2">
                <h2>CADASTRE-SE</h2>

                <form method="put" action="">

                    <section class="sec1">
                        <input required name="nome" placeholder="Nome Completo" id="nome" type="text">
                        <input required name="date" placeholder="Nascimento" class="textbox-n" type="text"
                            onfocus="(this.type='date')" onblur="(this.type='text')" id="date" />
                        <input required name="email" placeholder="Email" id="email" type="email">
                        <input required name="senha" placeholder="Senha" id="senha" type="password">
                        <input required name="senhac" placeholder="Confirmar Senha" id="confSenha" type="password">
                    </section>

                    <section class="frm-group">
                        <input type="text" name="cep" placeholder="CEP" id="CEP" />

                        <input type="text" name="rua" placeholder="Rua" id="rua" />

                        <input type="text" name="cidade" placeholder="Cidade" id="cidade" />

                        <input type="text" name="estado" placeholder="Estado" id="estado" />

                        <select name="sexo" id="sexo">
                            <option value="" disabled selected id="colo">Seu Genero</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Prefiro não dizer">Prefiro não dizer</option>
                        </select>

                    </section>

                    <a href="../login/login.html" id="link">
                        <button onclick="take()" id="click" href="">Concluir cadastro</button>
                    </a>

                </form>

            </div>
        </div>
    </main>
